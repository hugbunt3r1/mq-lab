defaults:
  actions:
    comment:
      bot_account: hugbunt3r1
queue_rules:
  - name: default
    queue_conditions:
      - label=ready-to-merge
    merge_conditions:
      - -conflict
    merge_method: squash
pull_request_rules:
  - name: echo-title
    conditions:
      - -closed
      - -head~=^mergify/
    actions:
      comment:
        message: "{{ title }}"
