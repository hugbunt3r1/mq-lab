queue_rules:
  - name: default
    merge_conditions: []
    merge_method: squash
pull_request_rules:
  - name: echo-title
    conditions: [-closed, -head~=^mergify/]
    actions: {comment: {message: "{{ title }}", bot_account: hugbunt3r1}}
  - name: auto-queue-mergify-bot-prs
    conditions: [author=mergify[bot]]
    actions: {queue: {name: default}}
