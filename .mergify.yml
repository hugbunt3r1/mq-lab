defaults:
  actions:
    comment:
      bot_account: hugbunt3r1
queue_rules:
  - name: default
    merge_conditions:
      - base=dev
    merge_method: squash
pull_request_rules:
  - name: echo-title
    conditions:
      - -closed
      - -head~=^mergify/
    actions:
      comment:
        message: "{{ title }}"
  - name: auto-queue-mergify-copies-to-dev
    conditions:
      - author=mergify[bot]
      - base=dev
    actions:
      queue:
        name: default
